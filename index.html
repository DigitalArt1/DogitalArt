
<!DOCTYPE html><html>
<head>
<title>CricNext Super</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#ff3c00;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.section{
padding:20px;
display:none;
}

.active{
display:block;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

.team{
font-size:18px;
margin:5px 0;
}

.status{
color:#22c55e;
font-weight:bold;
}

button{
background:orange;
border:none;
padding:10px 20px;
border-radius:6px;
margin-top:10px;
color:black;
font-weight:bold;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav button{
background:none;
color:white;
font-size:16px;
}

.search{
width:100%;
padding:10px;
border-radius:6px;
border:none;
margin-top:10px;
}

.install{
background:#22c55e;
margin-top:10px;
}

</style></head><body><header>⚡ CricNext Super</header><!-- HOME --><div id="home" class="section active"><div class="card"><h3>Trending Players</h3><button onclick="searchPlayer('virat kohli highlights')">Virat Kohli</button>
<button onclick="searchPlayer('rohit sharma batting')">Rohit Sharma</button>
<button onclick="searchPlayer('jasprit bumrah yorker')">Jasprit Bumrah</button>

</div><div class="card"><h3>Quick Links</h3><button onclick="openSite('https://www.cricbuzz.com/cricket-match/live-scores')">Live Scores</button>

<button onclick="openSite('https://www.espncricinfo.com/cricket-news')">Cricket News</button>

</div><button id="installBtn" class="install">Install App</button>

</div><!-- LIVE --><div id="live" class="section"><div class="card"><h3>Loading Live Matches...</h3></div></div><!-- VIDEOS --><div id="video" class="section"><div class="card"><h3>Search Cricket Highlights</h3><input id="searchBox" class="search" placeholder="Search player or match"><button onclick="searchVideo()">Search</button>

</div></div><!-- NAVIGATION --><div class="nav"><button onclick="show('home')">Home</button>
<button onclick="show('live')">Live</button>
<button onclick="show('video')">Videos</button>

</div><script>

const API_KEY = "eec8a601-3746-4b6f-992f-ea00d5506fb8";

function show(section){

document.querySelectorAll('.section').forEach(s=>{
s.classList.remove('active')
})

document.getElementById(section).classList.add('active')

}

function searchPlayer(name){
window.open("https://www.youtube.com/results?search_query="+name)
}

function searchVideo(){

let q=document.getElementById("searchBox").value

window.open("https://www.youtube.com/results?search_query="+q)

}

function openSite(url){
window.open(url)
}

async function loadMatches(){

try{

let response = await fetch(
"https://api.cricketdata.org/v1/matches?apikey="+API_KEY
)

let data = await response.json()

let html=""

if(data.data && data.data.length>0){

data.data.slice(0,10).forEach(match=>{

html+=`

<div class="card">

<h3>${match.name}</h3>

<div class="team">${match.teams[0]}</div>

<div class="team">vs</div>

<div class="team">${match.teams[1]}</div>

<p class="status">${match.status}</p>

</div>

`

})

}else{

html="<div class='card'>No live matches right now</div>"

}

document.getElementById("live").innerHTML=html

}catch(e){

document.getElementById("live").innerHTML=
"<div class='card'>Live data unavailable</div>"

}

}

loadMatches()

setInterval(loadMatches,15000)

</script></body>
</html>
