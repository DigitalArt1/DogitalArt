<script>

const API_KEY="eec8a601-3746-4b6f-992f-ea00d5506fb8"

async function loadLive(){

let container=document.getElementById("live")

container.innerHTML="Loading..."

try{

let res=await fetch(
"https://api.cricketdata.org/v1/currentMatches?apikey="+API_KEY
)

let data=await res.json()

if(!data || !data.data){

container.innerHTML="No data from API"
return

}

let html=""

data.data.forEach(m=>{

html+=`

<div class="card">

<h3>${m.name}</h3>

<p>${m.teams.join(" vs ")}</p>

<p>${m.status}</p>

</div>

`

})

container.innerHTML=html

}

catch(err){

container.innerHTML="API Error"

}

}

async function loadIPL(){

let box=document.getElementById("upcoming")

box.innerHTML="Loading IPL fixtures..."

try{

let res=await fetch(
"https://api.cricketdata.org/v1/series_matches?apikey="+API_KEY+"&series_id=ipl"
)

let data=await res.json()

let html=""

if(data.data){

data.data.forEach(m=>{

html+=`

<div class="card">

<h3>${m.name}</h3>

<p>${m.teams.join(" vs ")}</p>

<p>${m.date}</p>

</div>

`

})

}

box.innerHTML=html || "No fixtures"

}

catch{

box.innerHTML="Fixtures error"

}

}

loadLive()

loadIPL()

setInterval(loadLive,20000)

</script>
