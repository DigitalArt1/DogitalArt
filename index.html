<!DOCTYPE html>
<html>
<head>
<title>CricNext Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#ff3c00;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.section{
padding:20px;
display:none;
}

.active{
display:block;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:10px;
}

button{
background:orange;
border:none;
padding:10px 20px;
border-radius:5px;
margin-top:10px;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav button{
background:none;
color:white;
font-size:16px;
}

.player{
display:flex;
justify-content:space-between;
margin-top:10px;
}

</style>
</head>

<body>

<header>⚡ CricNext Ultra</header>

<!-- HOME -->
<div id="home" class="section active">

<div class="card">
<h3>Trending Players</h3>

<div class="player">
<span>Virat Kohli</span>
<button onclick="searchPlayer('virat kohli')">View</button>
</div>

<div class="player">
<span>Rohit Sharma</span>
<button onclick="searchPlayer('rohit sharma')">View</button>
</div>

<div class="player">
<span>Jasprit Bumrah</span>
<button onclick="searchPlayer('bumrah bowling')">View</button>
</div>

</div>

</div>

<!-- LIVE SCORE -->
<div id="score" class="section">

<div class="card">

<h3>Live Score</h3>

<iframe id="scoreFrame"
src="https://www.cricbuzz.com/cricket-match/live-scores"
width="100%" height="450"></iframe>

<button onclick="refreshScore()">Refresh Score</button>

</div>

</div>

<!-- NEWS -->
<div id="news" class="section">

<div class="card">
<h3>Cricket News</h3>

<button onclick="window.open('https://www.espncricinfo.com/cricket-news')">
Latest News
</button>

</div>

</div>

<!-- VIDEOS -->
<div id="video" class="section">

<div class="card">

<h3>IPL Highlights</h3>

<button onclick="window.open('https://www.youtube.com/results?search_query=ipl highlights')">
Watch Highlights
</button>

</div>

</div>

<!-- NAVIGATION -->
<div class="nav">

<button onclick="show('home')">Home</button>
<button onclick="show('score')">Live</button>
<button onclick="show('news')">News</button>
<button onclick="show('video')">Videos</button>

</div>

<script>

function show(section){

document.querySelectorAll('.section').forEach(s=>{
s.classList.remove('active')
})

document.getElementById(section).classList.add('active')

}

function searchPlayer(name){
window.open("https://www.youtube.com/results?search_query="+name)
}

function refreshScore(){
document.getElementById("scoreFrame").src =
document.getElementById("scoreFrame").src
}

</script>

</body>
</html>
</div>


<div id="video" class="section">

<div class="card">
<h3>IPL Highlights</h3>

<button onclick="window.open('https://www.youtube.com/results?search_query=ipl+highlights')">
Watch Highlights
</button>

</div>

</div>


<div class="nav">

<button onclick="show('home')">Home</button>
<button onclick="show('score')">Live</button>
<button onclick="show('news')">News</button>
<button onclick="show('video')">Videos</button>

</div>


<script>

function show(section){

document.querySelectorAll('.section').forEach(s=>{
s.classList.remove('active')
})

document.getElementById(section).classList.add('active')

}

</script>

</body>
</html>
