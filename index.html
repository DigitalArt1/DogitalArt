<!DOCTYPE html>
<html>
<head>
<title>CricNext Super</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#ff3c00;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.section{
padding:20px;
display:none;
}

.active{
display:block;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

button{
background:orange;
border:none;
padding:10px 20px;
border-radius:6px;
margin-top:10px;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav button{
background:none;
color:white;
font-size:16px;
}

.search{
width:100%;
padding:10px;
border-radius:6px;
border:none;
margin-top:10px;
}

.install{
background:#22c55e;
margin-top:10px;
}

</style>

</head>

<body>

<header>⚡ CricNext Super</header>

<!-- HOME -->

<div id="home" class="section active">

<div class="card">

<h3>Trending Players</h3>

<button onclick="searchPlayer('virat kohli highlights')">Virat Kohli</button>
<button onclick="searchPlayer('rohit sharma batting')">Rohit Sharma</button>
<button onclick="searchPlayer('bumrah yorker')">Jasprit Bumrah</button>

</div>

<div class="card">

<h3>Quick Cricket Links</h3>

<button onclick="openSite('https://www.cricbuzz.com/cricket-match/live-scores')">
Live Scores
</button>

<button onclick="openSite('https://www.espncricinfo.com/series/ipl')">
IPL Schedule
</button>

</div>

<button id="installBtn" class="install">Install App</button>

</div>

<!-- LIVE -->

<div id="live" class="section">

<div class="card">

<h3>Live Cricket Score</h3>

<button onclick="openSite('https://www.cricbuzz.com/cricket-match/live-scores')">
Open Live Score
</button>

<button onclick="openSite('https://www.espncricinfo.com/live-cricket-score')">
Alt Score
</button>

</div>

</div>

<!-- NEWS -->

<div id="news" class="section">

<div class="card">

<h3>Latest Cricket News</h3>

<button onclick="openSite('https://www.espncricinfo.com/cricket-news')">
Open News
</button>

</div>

</div>

<!-- VIDEOS -->

<div id="video" class="section">

<div class="card">

<h3>Search Cricket Highlights</h3>

<input id="searchBox" class="search" placeholder="Search player or match">

<button onclick="searchVideo()">Search</button>

</div>

</div>

<!-- NAVIGATION -->

<div class="nav">

<button onclick="show('home')">Home</button>
<button onclick="show('live')">Live</button>
<button onclick="show('news')">News</button>
<button onclick="show('video')">Videos</button>

</div>

<script>

function show(section){

document.querySelectorAll('.section').forEach(s=>{
s.classList.remove('active')
})

document.getElementById(section).classList.add('active')

}

function searchPlayer(name){
window.open("https://www.youtube.com/results?search_query="+name)
}

function searchVideo(){

let q=document.getElementById("searchBox").value

window.open("https://www.youtube.com/results?search_query="+q)

}

function openSite(url){
window.open(url)
}

/* Install PWA */

let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {

e.preventDefault();

deferredPrompt = e;

document.getElementById("installBtn").style.display="block";

});

document.getElementById("installBtn").addEventListener("click", () => {

if(deferredPrompt){

deferredPrompt.prompt();

}

});

</script>

</body>
</html>
