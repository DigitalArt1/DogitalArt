<!DOCTYPE html><html>
<head>
<title>CricNext Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#16a34a;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.section{
padding:15px;
display:none;
}

.active{
display:block;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:12px;
border-radius:10px;
}

.teams{
display:flex;
justify-content:space-between;
align-items:center;
margin:5px 0;
}

.team{
display:flex;
align-items:center;
gap:8px;
}

.team img{
width:24px;
height:24px;
}

.score{
color:#facc15;
font-size:18px;
}

.status{
font-size:13px;
color:#22c55e;
}

.tabs{
display:flex;
background:#020617;
}

.tabs button{
flex:1;
padding:12px;
background:none;
border:none;
color:white;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav button{
background:none;
border:none;
color:white;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
padding:8px;
border-bottom:1px solid #333;
}

.ad{
background:#111827;
text-align:center;
padding:10px;
margin:10px 0;
border-radius:8px;
}

</style></head><body><header>⚡ CricNext Ultra</header><div class="tabs">
<button onclick="show('live')">Live</button>
<button onclick="show('table')">Points</button>
<button onclick="show('video')">Videos</button>
</div><!-- LIVE --><div id="live" class="section active"><div class="ad">
Ad Space
</div><div id="liveMatches"></div></div><!-- POINTS TABLE --><div id="table" class="section"><div class="card"><h3>Points Table</h3><table><tr>
<th>Team</th>
<th>P</th>
<th>Pts</th>
</tr><tr>
<td>India</td>
<td>5</td>
<td>10</td>
</tr><tr>
<td>Australia</td>
<td>5</td>
<td>8</td>
</tr><tr>
<td>England</td>
<td>5</td>
<td>6</td>
</tr></table></div></div><!-- VIDEOS --><div id="video" class="section"><div class="card"><h3>Search Highlights</h3><input id="searchBox" placeholder="Search player"><button onclick="searchVideo()">Search</button>

</div></div><div class="nav"><button onclick="show('live')">Live</button>
<button onclick="show('table')">Points</button>
<button onclick="show('video')">Videos</button>

</div><script>

const API_KEY="eec8a601-3746-4b6f-992f-ea00d5506fb8"

function show(section){

document.querySelectorAll('.section').forEach(s=>{
s.classList.remove('active')
})

document.getElementById(section).classList.add('active')

}

function searchVideo(){

let q=document.getElementById("searchBox").value

window.open("https://www.youtube.com/results?search_query="+q)

}

async function loadMatches(){

try{

let res=await fetch(
"https://api.cricketdata.org/v1/matches?apikey="+API_KEY
)

let data=await res.json()

let html=""

data.data.slice(0,8).forEach(match=>{

html+=`

<div class="card">

<h3>${match.name}</h3>

<div class="teams">

<div class="team">
<img src="https://cdn-icons-png.flaticon.com/512/197/197374.png">
${match.teams[0]}
</div>

<div class="score">vs</div>

<div class="team">
<img src="https://cdn-icons-png.flaticon.com/512/197/197484.png">
${match.teams[1]}
</div>

</div>

<p class="status">${match.status}</p>

</div>

`

})

document.getElementById("liveMatches").innerHTML=html

}catch(e){

document.getElementById("liveMatches").innerHTML="Error loading matches"

}

}

loadMatches()

setInterval(loadMatches,15000)

</script></body></html>
