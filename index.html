<!DOCTYPE html><html>
<head>
<title>CricNext Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"><style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

header{
background:#16a34a;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.tabs{
display:flex;
justify-content:space-around;
background:#020617;
}

.tabs button{
flex:1;
padding:12px;
background:none;
border:none;
color:white;
font-size:16px;
}

.section{
padding:15px;
display:none;
}

.active{
display:block;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:12px;
border-radius:10px;
}

.teams{
display:flex;
justify-content:space-between;
margin:5px 0;
}

.team{
font-size:16px;
}

.score{
color:#facc15;
font-size:18px;
}

.status{
font-size:13px;
color:#22c55e;
}

.nav{
position:fixed;
bottom:0;
width:100%;
background:#020617;
display:flex;
justify-content:space-around;
padding:10px 0;
}

.nav button{
background:none;
border:none;
color:white;
font-size:16px;
}

.search{
width:100%;
padding:10px;
border-radius:6px;
border:none;
margin-top:10px;
}

button.primary{
background:orange;
border:none;
padding:10px 18px;
border-radius:6px;
color:black;
font-weight:bold;
margin-top:10px;
}

</style></head><body><header>⚡ CricNext Live</header><div class="tabs">
<button onclick="showSection('live')">Live</button>
<button onclick="showSection('recent')">Recent</button>
<button onclick="showSection('upcoming')">Upcoming</button>
</div><!-- LIVE --><div id="live" class="section active">
<div class="card">Loading live matches...</div>
</div><!-- RECENT --><div id="recent" class="section">
<div class="card">Loading recent matches...</div>
</div><!-- UPCOMING --><div id="upcoming" class="section">
<div class="card">Loading upcoming matches...</div>
</div><!-- VIDEOS --><div id="video" class="section"><div class="card"><h3>Search Cricket Highlights</h3><input id="searchBox" class="search" placeholder="Search player or match"><button class="primary" onclick="searchVideo()">Search</button>

</div></div><div class="nav"><button onclick="showSection('live')">Live</button>
<button onclick="showSection('recent')">Recent</button>
<button onclick="showSection('upcoming')">Upcoming</button>
<button onclick="showSection('video')">Videos</button>

</div><script>

const API_KEY="eec8a601-3746-4b6f-992f-ea00d5506fb8";

function showSection(id){

document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'))

document.getElementById(id).classList.add('active')

}

function searchVideo(){

let q=document.getElementById("searchBox").value

window.open("https://www.youtube.com/results?search_query="+q)

}

function parseScore(scoreArr,team){

if(!Array.isArray(scoreArr)) return "—"

let obj=scoreArr[0]

if(!obj) return "—"

return obj.r+"/"+obj.w+" ("+obj.o+" ov)"

}

async function loadMatches(){

try{

let res=await fetch(
"https://api.cricketdata.org/v1/currentMatches?apikey="+API_KEY
)

let data=await res.json()

let htmlLive=""
let htmlRecent=""
let htmlUpcoming=""

data.data.forEach(match=>{

let score=parseScore(match.score)

let card=`

<div class="card">

<h3>${match.name}</h3>

<div class="teams">

<div class="team">${match.teams[0]}</div>

<div class="score">${score}</div>

</div>

<div class="teams">

<div class="team">${match.teams[1]}</div>

</div>

<p class="status">${match.status}</p>

</div>

`

if(match.status.toLowerCase().includes("live")){
htmlLive+=card
}

else if(match.status.toLowerCase().includes("won")){
htmlRecent+=card
}

else{
htmlUpcoming+=card
}

})

document.getElementById("live").innerHTML=htmlLive||"<div class='card'>No live matches</div>"
document.getElementById("recent").innerHTML=htmlRecent||"<div class='card'>No recent matches</div>"
document.getElementById("upcoming").innerHTML=htmlUpcoming||"<div class='card'>No upcoming matches</div>"

}catch(e){

document.getElementById("live").innerHTML="<div class='card'>Live data unavailable</div>"

}

}

loadMatches()

setInterval(loadMatches,15000)

</script></body></html>
