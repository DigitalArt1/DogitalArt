<script>

const API_KEY="eec8a601-3746-4b6f-992f-ea00d5506fb8"

function showTab(id){
document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function searchVideo(){
let q=document.getElementById("searchBox").value
window.open("https://www.youtube.com/results?search_query="+q)
}

function scoreFormat(score){
if(!score || score.length==0) return "-"

let s=score[0]

return s.r+"/"+s.w+" ("+s.o+" ov)"
}

function matchCard(match){

let score=scoreFormat(match.score)

return `

<div class="card">

<h3>${match.name}</h3>

<div class="teams">

<div>${match.teams[0]}</div>
<div class="score">${score}</div>

</div>

<div class="teams">

<div>${match.teams[1]}</div>

</div>

<p class="status">${match.status}</p>

</div>

`

}

async function loadLiveMatches(){

try{

let res=await fetch(
"https://api.cricketdata.org/v1/currentMatches?apikey="+API_KEY
)

let json=await res.json()

let html=""

json.data.forEach(m=>{

if(m.status.toLowerCase().includes("live")){
html+=matchCard(m)
}

})

document.getElementById("live").innerHTML=
html || "<div class='card'>No live matches</div>"

}

catch(e){

document.getElementById("live").innerHTML=
"<div class='card'>Live data unavailable</div>"

}

}

async function loadIPLFixtures(){

try{

let res=await fetch(
"https://api.cricketdata.org/v1/series_matches?apikey="+API_KEY+"&series_id=ipl"
)

let json=await res.json()

let html=""

json.data.forEach(m=>{

html+=`

<div class="card">

<h3>${m.name}</h3>

<p>${m.teams[0]} vs ${m.teams[1]}</p>

<p class="status">${m.date}</p>

</div>

`

})

document.getElementById("upcoming").innerHTML=
html || "<div class='card'>No IPL fixtures</div>"

}

catch(e){

document.getElementById("upcoming").innerHTML=
"<div class='card'>Fixtures unavailable</div>"

}

}

loadLiveMatches()

loadIPLFixtures()

setInterval(loadLiveMatches,20000)

</script>
